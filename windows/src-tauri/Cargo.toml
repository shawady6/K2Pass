[package]
name = "k2pass-windows"
version = "0.4.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
k2-lan = { path = "../k2-lan" }
local-ip-address = "0.6"
base64 = "0.22"
