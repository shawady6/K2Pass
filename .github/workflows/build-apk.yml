name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.K2_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.K2_KEYSTORE_PASSWORD }}
        run: |
          # The keystore itself comes from the K2_KEYSTORE_B64 secret if present, otherwise from signing/k2pass.jks
          # (PKCS12, protected by a 28-character random password that exists only in the K2_KEYSTORE_PASSWORD secret).
          if [ -n "$KS_PW" ]; then
            if [ -n "$KS_B64" ]; then
              echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/k2pass.jks"
            else
              cp signing/k2pass.jks "$RUNNER_TEMP/k2pass.jks"
            fi
            echo "K2_KEYSTORE_FILE=$RUNNER_TEMP/k2pass.jks" >> "$GITHUB_ENV"
            echo "K2_KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
            echo "HAVE_KEY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::K2_KEYSTORE_PASSWORD secret is missing: the APK gets a random debug key and will NOT be published (in-app updates would break)."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: K2Pass-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK as the "latest" release
        if: github.ref == 'refs/heads/main' && env.HAVE_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk K2Pass-debug.apk
          VC=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          VN=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          SHA=$(sha256sum K2Pass-debug.apk | cut -d' ' -f1)
          printf 'Debug build of %s\nversionCode: %s\nversionName: %s\nsha256: %s\n' "${GITHUB_SHA::7}" "$VC" "$VN" "$SHA" > notes.txt
          gh release delete latest --cleanup-tag -y || true
          gh release create latest K2Pass-debug.apk \
            --title "K2Pass latest debug build" \
            --notes-file notes.txt \
            --target "$GITHUB_SHA" \
            --prerelease
