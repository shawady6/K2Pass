<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>K2Pass — ربط الموبايل</title>
<link rel="stylesheet" href="popup.css">
</head>
<body class="page">
<header><div class="brand"><img src="icons/48.png" alt="" width="28" height="28"><span>ربط الموبايل</span></div></header>
<main>
  <div class="card">
    <div class="step"><div class="num">1</div><div>
      <h2>امسح الكود بالموبايل</h2>
      <p class="hint">افتح K2Pass ← <b>الأدوات</b> ← <b>مزامنة مع إضافة المتصفح</b> ← <b>مسح كود الإضافة</b>. لازم يكون على نفس الواي فاي.</p>
    </div></div>
    <div id="qr"></div>
    <p class="hint" style="text-align:center"><i data-i="shield" data-s="14"></i> الكود ده سرّ بيربط الكمبيوتر بخزنتك. ما تصوّرهوش.</p>
    <div class="step"><div class="num">2</div><div>
      <h2>استنى الربط</h2>
    </div></div>
    <div id="status" class="status"><span class="dot"></span><span id="msg">في انتظار مسح الكود…</span></div>
    <details>
      <summary>الموبايل مش بيظهر؟ اربط بالعنوان يدويًا</summary>
      <p class="hint" style="margin:8px 0">اكتب العنوان الظاهر في التطبيق:</p>
      <div class="row2"><input id="manual" type="text" placeholder="192.168.1.20:8765" dir="ltr"><button id="use-manual" class="ghost">ربط</button></div>
    </details>
    <button id="new-code" class="ghost"><i data-i="sync" data-s="16"></i>كود جديد</button>
  </div>
</main>
<script src="lib/qrcode.js"></script>
<script type="module" src="sync.js"></script>
</body>
</html>
