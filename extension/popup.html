<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K2Pass</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand"><img src="icons/48.png" alt="" width="28" height="28"><span>K2Pass</span></div>
    <div class="hdr-actions">
      <button id="btn-lock" class="icon hidden" title="قفل"><i data-i="lock"></i></button>
    </div>
  </header>

  <main>
    <section id="v-import" class="hidden">
      <div class="card hero">
        <div class="badge"><i data-i="bolt" data-s="30"></i></div>
        <h2>افتح تطبيق K2Pass</h2>
        <p class="lead" id="imp-msg">الإضافة بتاخد الخزنة من تطبيق K2Pass على الكمبيوتر. شغّل التطبيق وافتح الخزنة فيه.</p>
        <button id="btn-retry" class="primary"><i data-i="sync" data-s="18"></i>جرّب تاني</button>
      </div>
    </section>

    <section id="v-unlock" class="hidden">
      <div class="card hero">
        <div class="badge"><i data-i="lock" data-s="30"></i></div>
        <h2>فتح الخزنة</h2>
        <p class="lead">اكتب الماستر باسورد عشان تفتح حساباتك.</p>
        <input id="pw" type="password" placeholder="الماستر باسورد" autocomplete="off">
        <button id="btn-unlock" class="primary">فتح</button>
        <p id="unlock-err" class="err"></p>
      </div>
    </section>

    <section id="v-list" class="hidden">
      <div class="searchbox"><i data-i="search" data-s="17"></i><input id="q" type="search" placeholder="ابحث في حساباتك" autocomplete="off"></div>
      <select id="folder"></select>
      <div id="list"></div>
      <p id="empty" class="empty hidden">مفيش نتائج</p>
    </section>
  </main>
  <div id="toast" class="toast hidden"></div>
  <script src="lib/argon2.umd.min.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
